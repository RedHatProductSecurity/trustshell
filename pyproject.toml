[project]
name = "trustshell"
version = "0.1.2"
description = "Command Line tool for Trustify"
readme = "README.md"
authors = [
    { email = "jason@jasonshepherd.net" }
]
requires-python = ">=3.12"
dependencies = [
    "anytree>=2.12.1",
    "click>=8.2.1",
    "httpx>=0.28.1",
    "osidb-bindings>=4.12.0",
    "packageurl-python>=0.16.0",
    "parameterized>=0.9.0",
    "pkce>=1.0.3",
    "pyjwt>=2.10.1",
    "pyyaml>=6.0",
    "rich>=14.0.0",
    "types-pyyaml>=6.0.12.20250809",
    "univers>=30.12.1",
]

[project.scripts]
trust-purl = "trustshell.purl:search"
trust-products = "trustshell.products:search"
trust-prime = "trustshell.products:prime_cache"
trust-api = "trustshell.api:api"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
]
lint = [
    "mypy>=1.0.0",
    "types-requests",  # For httpx which may use requests-like interfaces
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# For libraries without stubs, ignore missing imports
[[tool.mypy.overrides]]
module = [
    "univers.*",
    "anytree.*",
    "osidb_bindings.*",
    "pkce.*",
]
ignore_missing_imports = true

[tool.ruff]
line-length = 88


